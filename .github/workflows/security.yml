name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run security:test
      - run: npm audit --audit-level=high
      - run: npm run security:sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyclonedx-sbom
          path: security-reports/sbom.json
          if-no-files-found: warn

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install --user semgrep
      - run: npm run security:semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: security-reports/semgrep.*
          if-no-files-found: warn

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            scan source -r .

  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: trivy-fs.json
          exit-code: "1"
          ignore-unfixed: false
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config.json
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem-reports
          path: trivy-*.json
          if-no-files-found: warn

  container-and-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build QA image
        run: docker build -t fintrack:local .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: fintrack:local
          format: json
          output: trivy-image.json
          exit-code: "1"
          ignore-unfixed: false
      - name: Start isolated QA deployment
        env:
          JWT_SECRET: "ci-only-jwt-secret-012345678901234567890123"
          AI_KEY_SECRET: "ci-only-ai-secret-012345678901234567890123"
        run: |
          docker run -d --name fintrack-qa -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$JWT_SECRET" \
            -e AI_KEY_SECRET="$AI_KEY_SECRET" \
            fintrack:local
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/login; then exit 0; fi
            sleep 2
          done
          docker logs fintrack-qa
          exit 1
      - name: OWASP ZAP baseline (authorized ephemeral QA only)
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD/security-reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://host.docker.internal:3000 \
            -J zap-report.json -r zap-report.html
      - name: Nuclei (non-intrusive templates against ephemeral QA only)
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD/security-reports:/out" projectdiscovery/nuclei:latest \
            -u http://host.docker.internal:3000 -tags misconfig,exposure,cves \
            -exclude-tags dos,fuzz,intrusive -severity info,low,medium,high,critical \
            -jsonl-export /out/nuclei.json
      - if: always()
        run: docker rm -f fintrack-qa || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-dast-reports
          path: |
            trivy-image.json
            security-reports/zap-report.*
            security-reports/nuclei.json
          if-no-files-found: warn
